services:
  backend:
    build: ./backend
    container_name: aisya-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    networks:
      - aisya-network

  frontend:
    build: ./frontend
    container_name: aisya-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - aisya-network

networks:
  aisya-network:
    driver: bridge
